<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>預約系統</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: linear-gradient(145deg, #f9e7b3 0%, #f5d78c 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 16px;
            touch-action: manipulation;
        }

        .card {
            background: rgba(255, 248, 235, 0.85);
            backdrop-filter: blur(4px);
            border-radius: 60px 60px 40px 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2), 0 8px 16px rgba(0, 0, 0, 0.1);
            padding: 32px 24px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            transition: all 0.25s ease;
            border: 2px solid #fff3d6;
        }

        h1 {
            font-size: 2.6rem;
            font-weight: 700;
            color: #4a2e1b;
            letter-spacing: 2px;
            margin-bottom: 8px;
            text-shadow: 0 4px 8px rgba(255, 215, 140, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        h1 span {
            background: #ffdbb5;
            padding: 0 16px;
            border-radius: 80px;
            font-size: 2.2rem;
            line-height: 1.4;
        }

        .subhead {
            font-size: 1rem;
            color: #6b4c2e;
            background: #ffe5c4;
            display: inline-block;
            padding: 6px 24px;
            border-radius: 40px;
            margin-bottom: 28px;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .date-section {
            margin: 0 0 18px;
            padding: 20px 16px;
            background: #fff6e5;
            border-radius: 60px;
            box-shadow: inset 0 2px 8px rgba(90, 60, 30, 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            border: 2px dashed #dbbd96;
        }

        .date-section label {
            font-size: 1.2rem;
            font-weight: 600;
            color: #4a321e;
            background: #efdbbc;
            padding: 4px 20px;
            border-radius: 60px;
            letter-spacing: 1px;
            width: 100%;
        }

        select, input[type="date"], input[type="time"] {
            background: white;
            border: 2px solid #dbbd96;
            padding: 12px 16px;
            border-radius: 60px;
            font-size: 1.1rem;
            width: 100%;
            max-width: 260px;
            color: #2d1f0f;
            font-weight: 600;
            outline: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
            transition: 0.2s;
            text-align: center;
            cursor: pointer;
        }

        select:focus, input[type="date"]:focus, input[type="time"]:focus {
            border-color: #b48b5a;
            box-shadow: 0 0 0 4px #f7dfbe;
        }

        .time-group {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }

        .time-group select {
            max-width: 160px;
            flex: 1;
            min-width: 100px;
        }

        .time-group input[type="time"] {
            max-width: 160px;
            flex: 1;
            min-width: 100px;
        }

        .btn-send {
            background: #7aa67a;
            border: none;
            color: white;
            padding: 14px 28px;
            border-radius: 60px;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            box-shadow: 0 6px 0 #3f6b3f, 0 8px 16px rgba(0,0,0,0.1);
            transition: 0.08s linear;
            cursor: pointer;
            width: fit-content;
            margin: 4px auto 0;
            border: 2px solid #b8d9b8;
            touch-action: manipulation;
        }

        .btn-send:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #3f6b3f, 0 8px 16px rgba(0,0,0,0.1);
        }

        .share-area {
            margin-top: 24px;
            background: #eedbc2;
            padding: 16px 12px;
            border-radius: 60px;
            display: none;
            border: 2px solid #dbbd96;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.05);
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .share-area.active {
            display: flex;
        }

        .share-message {
            font-size: 1.3rem;
            background: #fffbf0;
            padding: 14px 18px;
            border-radius: 40px;
            width: 100%;
            word-break: break-word;
            color: #302010;
            border: 1px solid #c6aa84;
            font-weight: 700;
            white-space: pre-line;
        }

        .share-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .share-btn {
            background: #4e7a9c;
            border: none;
            padding: 12px 24px;
            border-radius: 60px;
            color: white;
            font-weight: 700;
            font-size: 1.1rem;
            box-shadow: 0 4px 0 #1f405a;
            transition: 0.08s linear;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border: 2px solid #8bb3d1;
            touch-action: manipulation;
        }

        .share-btn:active {
            transform: translateY(4px);
            box-shadow: 0 0px 0 #1f405a;
        }

        .share-btn.copy-btn {
            background: #a88b6b;
            box-shadow: 0 4px 0 #6f553b;
            border-color: #cfb79b;
        }

        .reset-area {
            margin-top: 20px;
            display: none;
            justify-content: center;
        }

        .reset-area.active {
            display: flex;
        }

        .reset-btn {
            background: transparent;
            border: 2px solid #ac8b6b;
            color: #4d3621;
            padding: 10px 28px;
            border-radius: 60px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
            touch-action: manipulation;
            background: rgba(255, 242, 224, 0.5);
        }

        .reset-btn:hover {
            background: #f5e2cb;
        }

        .footer-note {
            margin-top: 22px;
            color: #5f4530;
            font-size: 0.8rem;
            opacity: 0.7;
            letter-spacing: 1px;
            height: 20px;
        }

        @media (max-width: 480px) {
            .card { padding: 24px 16px; }
            h1 { font-size: 2.2rem; }
            .time-group { flex-direction: column; align-items: center; }
            .time-group select, .time-group input[type="time"] { max-width: 220px; }
        }
    </style>
</head>
<body>
<div class="card" id="appCard">
    <h1>
        <span>📅</span> 預約系統 <span>📅</span>
    </h1>
    <div class="subhead">填寫預約資訊</div>

    <!-- 直接顯示預約表單，移除要/不要按鈕 -->
    <div class="date-section" id="dateSection">
        <label for="serviceSelect">📋 選擇項目</label>
        <select id="serviceSelect">
            <option value="">請選擇</option>
            <option value="出門">🚶 出門</option>
            <option value="聊天">💬 聊天</option>
            <option value="打電話">📞 打電話</option>
        </select>

        <label>📅 選擇日期</label>
        <input type="date" id="datePicker" value="2026-08-24" min="2026-08-24">

        <label>⏰ 選擇時間</label>
        <div class="time-group">
            <select id="timeTypeSelect">
                <option value="now">🟢 現在</option>
                <option value="specific">🕐 指定時間</option>
                <option value="later">🌙 晚點</option>
            </select>
            <input type="time" id="timePicker" value="15:00" style="display:none;">
        </div>

        <button class="btn-send" id="btnSendDate">📨 送出預約</button>
    </div>

    <div class="share-area" id="shareArea">
        <div class="share-message" id="shareMessage">🎉 預約成功！</div>
        <div class="share-buttons">
            <button class="share-btn" id="copyBtn">📋 複製訊息</button>
            <button class="share-btn" id="shareBtn">📤 分享</button>
        </div>
    </div>

    <div class="reset-area" id="resetArea">
        <button class="reset-btn" id="resetBtn">⟳ 重新開始</button>
    </div>

    <div class="footer-note"></div>
</div>

<script>
    (function() {
        "use strict";

        const serviceSelect = document.getElementById('serviceSelect');
        const datePicker = document.getElementById('datePicker');
        const timeTypeSelect = document.getElementById('timeTypeSelect');
        const timePicker = document.getElementById('timePicker');
        const btnSendDate = document.getElementById('btnSendDate');
        const shareArea = document.getElementById('shareArea');
        const shareMessage = document.getElementById('shareMessage');
        const copyBtn = document.getElementById('copyBtn');
        const shareBtn = document.getElementById('shareBtn');
        const resetBtn = document.getElementById('resetBtn');
        const resetArea = document.getElementById('resetArea');

        let currentDate = datePicker.value;
        let currentService = '';
        let currentTime = '';

        // 時間類型切換
        timeTypeSelect.addEventListener('change', function() {
            if (this.value === 'specific') {
                timePicker.style.display = 'inline-block';
                timePicker.value = '15:00';
            } else {
                timePicker.style.display = 'none';
            }
        });

        // 重置所有狀態
        function resetAllState() {
            shareArea.classList.remove('active');
            resetArea.classList.remove('active');

            // 重置下拉選單
            serviceSelect.value = '';
            currentService = '';
            timeTypeSelect.value = 'now';
            timePicker.style.display = 'none';
            timePicker.value = '15:00';

            const today = new Date().toISOString().split('T')[0];
            datePicker.value = today;
            currentDate = today;
            shareMessage.textContent = '🎉 預約成功！';
        }

        // 取得時間文字
        function getTimeText() {
            const timeType = timeTypeSelect.value;
            if (timeType === 'now') return '現在';
            if (timeType === 'later') return '晚點';
            if (timeType === 'specific') {
                const timeVal = timePicker.value || '15:00';
                return timeVal;
            }
            return '';
        }

        // 送出預約
        function handleSendDate() {
            const selectedService = serviceSelect.value;
            const selectedDate = datePicker.value;
            const timeText = getTimeText();

            // 檢查是否有選擇項目
            if (!selectedService) {
                alert('請選擇要預約的項目！');
                return;
            }

            if (!selectedDate) {
                alert('請選擇日期！');
                return;
            }

            // 取得服務名稱的 emoji
            const serviceEmoji = {
                '出門': '🚶',
                '聊天': '💬',
                '打電話': '📞'
            };

            const emoji = serviceEmoji[selectedService] || '📋';
            const confirmMessage = `📅 確認預約「${emoji} ${selectedService}」\n📆 ${selectedDate}\n⏰ ${timeText}\n\n確定嗎？`;

            if (confirm(confirmMessage)) {
                currentService = selectedService;
                currentDate = selectedDate;
                const displayTime = timeText;
                shareMessage.textContent = `🎉 預約成功！${emoji} ${currentService}\n📆 ${currentDate} · ⏰ ${displayTime}`;
                shareArea.classList.add('active');
                resetArea.classList.add('active');
            }
        }

        // 複製訊息
        function handleCopy() {
            const text = shareMessage.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const original = copyBtn.textContent;
                copyBtn.textContent = '✅ 已複製!';
                setTimeout(() => { copyBtn.textContent = original; }, 1800);
            }).catch(() => {
                alert('複製失敗，請手動複製：' + text);
            });
        }

        // 分享
        function handleShare() {
            const text = shareMessage.textContent;
            if (navigator.share) {
                navigator.share({
                    title: '預約',
                    text: text,
                }).catch((err) => {
                    if (err.name !== 'AbortError') {
                        alert('分享失敗: ' + err);
                    }
                });
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    alert('已複製訊息到剪貼簿，可以貼給朋友 💌');
                }).catch(() => {
                    alert('請手動複製訊息：' + text);
                });
            }
        }

        // 重新開始
        function handleReset() {
            resetAllState();
        }

        // 綁定事件
        btnSendDate.addEventListener('click', handleSendDate);
        copyBtn.addEventListener('click', handleCopy);
        shareBtn.addEventListener('click', handleShare);
        resetBtn.addEventListener('click', handleReset);

        datePicker.addEventListener('change', function() {
            currentDate = this.value;
        });

        serviceSelect.addEventListener('change', function() {
            currentService = this.value;
        });

        // 設定預設日期
        (function setDefaultDate() {
            const today = new Date().toISOString().split('T')[0];
            datePicker.value = today;
            currentDate = today;
        })();

        console.log('📅 預約系統已準備好了！');
    })();
</script>
</body>
</html>
